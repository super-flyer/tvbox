on:
  schedule:
    - cron: '0 0 * * *'  # 每天 00:00 UTC（北京时间 8 点）
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # 拉取完整历史，否则无法 merge

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/qist/tvbox.git
          git fetch upstream

      - name: Detect default branches
        id: detect
        run: |
          ORIGIN_BRANCH=$(git remote show origin | grep 'HEAD branch' | awk '{print $NF}')
          UPSTREAM_BRANCH=$(git remote show upstream | grep 'HEAD branch' | awk '{print $NF}')
          echo "origin default: $ORIGIN_BRANCH"
          echo "upstream default: $UPSTREAM_BRANCH"
          echo "ORIGIN_BRANCH=$ORIGIN_BRANCH" >> $GITHUB_ENV
          echo "UPSTREAM_BRANCH=$UPSTREAM_BRANCH" >> $GITHUB_ENV

      - name: Merge upstream changes
        run: |
          git checkout $ORIGIN_BRANCH
          git merge upstream/$UPSTREAM_BRANCH --allow-unrelated-histories -m "🔄 Auto sync from upstream"

      - name: Push changes
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }} $ORIGIN_BRANCH
